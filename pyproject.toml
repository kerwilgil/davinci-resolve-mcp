[project]
name = "davinci-resolve-mcp"
version = "1.0.0"
description = "A local-first Model Context Protocol server for structured DaVinci Resolve automation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kerwil Gil", email = "kerwil.gil@up.ac.pa" }
]

dependencies = [
    "mcp==1.30.0",
    "jsonschema==4.26.0",
]

[project.scripts]
davinci-resolve-mcp = "davinci_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["davinci_mcp*"]

[project.optional-dependencies]
transcription = [
    "faster-whisper==1.2.1",
]
audio = [
    "demucs==4.1.0",
    "soundfile==0.14.0",
]
background-removal = [
    "rembg[cpu]==2.0.76",
]

[project.urls]
Repository = "https://github.com/kerwilgil/davinci-resolve-mcp"
Issues = "https://github.com/kerwilgil/davinci-resolve-mcp/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]


[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"