name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install hash-locked core dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install build and validation tools
        run: python -m pip install build setuptools wheel ruff==0.15.7
      - name: Build release artifacts
        run: python -m build --no-isolation
      - name: Install actual wheel
        shell: bash
        run: python -m pip install --no-deps dist/*.whl
      - name: Run tests including installed stdio and loopback bridge
        run: python -m unittest discover -s tests -v
      - name: Lint runtime correctness
        run: ruff check src tests scripts/autostart.py
      - name: Validate Windows installer and rollback with controlled Claude CLI
        if: matrix.os == 'windows-latest' && matrix.python == '3.11'
        shell: pwsh
        run: |
          python -m pip install uv
          ./tests/test_installer.ps1

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
      - name: Audit locked runtime dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --disable-pip --no-deps -r requirements.lock
      - name: Install pinned Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan history and publication tree without printing secrets
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner .
          publication_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$publication_dir"
          "$(go env GOPATH)/bin/gitleaks" dir --redact --no-banner "$publication_dir"
